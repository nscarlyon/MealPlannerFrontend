<div class="search-bar-wrapper">
  <mat-form-field appearance="outline" subscriptSizing="dynamic" class="search-field">
    <mat-icon matIconPrefix (click)="openFilterDialog()" class="clickable">filter_list</mat-icon>
    <mat-label>Search meals</mat-label>
    <mat-chip-grid #chipGrid>
      @for (mealType of mealTypeFilters(); track mealType) {
        <mat-chip-row
          (removed)="removeMealFilter(mealType)"
          [aria-description]="mealType">
          {{ mealType }}
          <button matChipRemove>
            <mat-icon>cancel</mat-icon>
          </button>
        </mat-chip-row>
      }
      @for (cuisine of cuisineFilters(); track cuisine) {
        <mat-chip-row
          (removed)="removeCuisineFilter(cuisine)"
          [aria-description]="cuisine">
          {{ cuisine }}
          <button matChipRemove>
            <mat-icon>cancel</mat-icon>
          </button>
        </mat-chip-row>
      }
    </mat-chip-grid>
    <input matInput
           [matChipInputFor]="chipGrid"
           (input)="applyFilter($event)"
           placeholder="Search by name..."
           #input>
  </mat-form-field>
</div>
